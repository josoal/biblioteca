<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardar en Biblioteca</title><link rel="stylesheet" href="style.css"></head>
<body class="clipper"><main>
<header><img src="icons/icon48.png" alt="" width="28" height="28"><div style="flex:1"><h1>Biblioteca</h1><small id="connection">Conectando a Notion…</small></div><button id="settings" type="button" title="Configuración" aria-label="Configuración">⚙</button></header>
<div id="already" class="banner" role="status" hidden></div>
<div id="unconfigured" class="section" hidden><strong>Configura la conexión una sola vez</strong><p class="hint">Necesitas una integración de Notion con acceso a «Biblioteca DB».</p><button id="configure" type="button">Conectar Notion</button></div>
<form id="form" hidden>
<label class="field"><span>Título</span><input id="title" required maxlength="1000"></label>
<label class="field"><span>Fuente original</span><input id="url" type="url" required maxlength="2000"></label>
<div id="media" class="media-hint" hidden></div>
<label id="look" class="look" hidden><input type="checkbox" id="useLook" checked><img id="lookIcon" class="look-icon" alt="Icono de la web" hidden><img id="lookCover" class="look-cover" alt="Imagen principal" hidden><span id="lookText"></span></label>
<div class="field"><span>Qué guardar</span><div class="modes">
<label><input type="radio" name="mode" value="link" checked> Enlace</label>
<label><input type="radio" name="mode" value="selection"> Selección</label>
<label><input type="radio" name="mode" value="article"> Página completa</label></div></div>
<div id="contentField" class="field" hidden><span>Contenido capturado</span><small id="summary" class="hint"></small><textarea id="content" rows="5" aria-label="Contenido capturado"></textarea><small id="count" class="hint"></small></div>
<div class="grid"><label class="field"><span>Tipo</span><select id="type"></select></label><label class="field"><span>Categoría</span><select id="category"></select></label></div>
<div class="field"><span>Proyecto</span><div class="chips" id="project"></div></div>
<div class="field"><span>Origen</span><div class="chips" id="origin"></div></div>
<div class="field"><label for="tags" style="display:block;font-weight:600;font-size:12px;margin-bottom:5px">Etiquetas</label><div class="tagbox"><span id="tagChips"></span><input id="tags" placeholder="Escribe y pulsa Intro (se crean si no existen)" list="tagOptions" autocomplete="off"></div><datalist id="tagOptions"></datalist></div>
<div class="grid"><label class="field"><span>Estado</span><select id="status"></select></label></div>
<label class="field"><span>Anotaciones</span><textarea id="notes" rows="3" placeholder="Añade un comentario o una nota…"></textarea></label>
<div class="actions"><button type="button" id="capture">📷 Capturar pantalla</button><button type="button" id="remove" hidden>Quitar captura</button></div><img id="screenshotPreview" alt="Vista previa de la captura" hidden>
<div id="duplicate" hidden></div>
<button type="submit" class="primary" id="save">Guardar en Notion</button>
</form><div class="status" id="message" role="status" aria-live="polite"></div><a id="openPage" target="_blank" rel="noopener noreferrer" hidden>Abrir documento en Notion ↗</a>
</main><script type="module" src="clip.js"></script></body></html>
